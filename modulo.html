
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duddy Krisna - 262605003 - Kalkulator Modular</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 12px #0002;
            text-align: center;
        }

        h2 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #hasil {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #15803d;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Kalkulator Modular</h2>
    <p>Hitung sisa hasil pembagian (a mod n)</p>

    <input type="number" id="angka" placeholder="Masukkan bilangan a">

    <input type="number" id="modulus" placeholder="Masukkan modulus n">

    <button onclick="hitungModular()">Hitung Modular</button>

    <div id="hasil"></div>
</div>

<script>
    function hitungModular() {
        let a = Number(document.getElementById("angka").value);
        let n = Number(document.getElementById("modulus").value);

        if (
            document.getElementById("angka").value === "" ||
            document.getElementById("modulus").value === ""
        ) {
            document.getElementById("hasil").innerHTML =
                "Masukkan kedua bilangan terlebih dahulu!";
            return;
        }

        if (!Number.isSafeInteger(a) ||
            !Number.isSafeInteger(n) || n <= 0) {
            document.getElementById("hasil").innerHTML =
                "Masukkan bilangan bulat yang valid dan modulus lebih dari 0!";
            return;
        }

        let hasil = ((a % n) + n) % n;

        document.getElementById("hasil").innerHTML =
            a + " mod " + n + " = " + hasil;
    }
</script>

</body>
</html>
