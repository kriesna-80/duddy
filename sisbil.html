
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
        }

        .kalkulator {
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .judul {
            color: #0d6efd;
            font-weight: bold;
        }

        #hasil {
            font-size: 32px;
            font-weight: bold;
            color: #0d6efd;
            overflow-wrap: anywhere;
            min-height: 45px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="kalkulator">

        <h2 class="text-center judul mb-4">
            Kalkulator Sistem Bilangan
        </h2>

        <!-- Input bilangan -->
        <div class="mb-3">
            <label for="bilangan" class="form-label">
                Masukkan Bilangan
            </label>
            <input type="text" id="bilangan"
                   class="form-control"
                   placeholder="Contoh: 1010">
        </div>

        <!-- Select sistem bilangan asal -->
        <div class="mb-3">
            <label for="asal" class="form-label">
                Sistem Bilangan Asal
            </label>
            <select id="asal" class="form-select">
                <option value="2">Biner (Basis 2)</option>
                <option value="8">Oktal (Basis 8)</option>
                <option value="10" selected>Desimal (Basis 10)</option>
                <option value="16">Heksadesimal (Basis 16)</option>
            </select>
        </div>

        <!-- Tombol konversi -->
        <div class="d-grid mb-3">
            <button class="btn btn-primary"
                    onclick="konversikan()">
                Konversi
            </button>
        </div>

        <!-- Select sistem bilangan hasil -->
        <div class="mb-3">
            <label for="tujuan" class="form-label">
                Sistem Bilangan Hasil
            </label>
            <select id="tujuan" class="form-select">
                <option value="2">Biner (Basis 2)</option>
                <option value="8">Oktal (Basis 8)</option>
                <option value="10">Desimal (Basis 10)</option>
                <option value="16" selected>Heksadesimal (Basis 16)</option>
            </select>
        </div>

        <!-- Label hasil -->
        <div class="card text-center mt-4">
            <div class="card-header">
                Hasil Konversi
            </div>
            <div class="card-body">
                <div id="hasil">---</div>
                <div id="pesan" class="text-danger mt-2"></div>
            </div>
        </div>

    </div>
</div>

<script>
    function konversikan() {
        const bilangan = document
            .getElementById("bilangan")
            .value.trim();

        const asal = parseInt(
            document.getElementById("asal").value
        );

        const tujuan = parseInt(
            document.getElementById("tujuan").value
        );

        const labelHasil = document.getElementById("hasil");
        const pesan = document.getElementById("pesan");

        labelHasil.textContent = "---";
        pesan.textContent = "";

        if (bilangan === "") {
            pesan.textContent = "Bilangan harus diisi!";
            return;
        }

        // Validasi digit sesuai basis asal
        const pola = {
            2: /^[+-]?[01]+$/,
            8: /^[+-]?[0-7]+$/,
            10: /^[+-]?[0-9]+$/,
            16: /^[+-]?[0-9a-fA-F]+$/
        };

        if (!pola[asal].test(bilangan)) {
            pesan.textContent =
                "Bilangan tidak valid untuk basis " + asal + "!";
            return;
        }

        try {
            // Ubah bilangan asal menjadi nilai BigInt
            const nilai = BigInt(bilangan);

            // Konversi ke basis tujuan
            const hasil = nilai.toString(tujuan);

            // Tampilkan hasil
            labelHasil.textContent =
                hasil.toUpperCase();

        } catch (error) {
            pesan.textContent =
                "Bilangan tidak dapat dikonversi.";
        }
    }
</script>

</body>
</html>
