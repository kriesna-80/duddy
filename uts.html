<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Online & Bukti Belajar Aritmetika Modular</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
}

/* NAVIGASI */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

nav ul{
    display:flex;
    justify-content:center;
    gap:30px;
    list-style:none;
    padding:18px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:#ffd700;
}

/* SECTION */

section{
    padding:60px 20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

/* BIODATA */

.profile{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.profile-header{
    text-align:center;
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:2px solid #e5e7eb;
}

.profile-header h1{
    color:#4f46e5;
    font-size:32px;
}

.profile-header p{
    color:#64748b;
    margin-top:8px;
}

.biodata-item{
    display:flex;
    margin-bottom:12px;
}

.label{
    width:150px;
    font-weight:bold;
    color:#4f46e5;
}

/* JUDUL */

.section-title{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:32px;
}

/* CARD */

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:#4f46e5;
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-top:10px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f1f5f9;
    margin-top:5px;
}

input:focus{
    outline:none;
    border:2px solid #667eea;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#667eea,#4f46e5);
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

button:hover{
    opacity:0.9;
}

.hasil{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:5px solid #4f46e5;
    border-radius:10px;
    min-height:50px;
}

.error{
    color:red;
    font-weight:bold;
}
