<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmetika Modular & Pengecek Kongruensi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 500px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        h3 {
            color: #007BFF;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .hasil {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .kongruen {
            color: green;
            font-weight: bold;
        }

        .tidak-kongruen {
            color: red;
            font-weight: bold;
        }

        hr {
            margin: 25px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Kalkulator Aritmetika Modular</h2>

    <label for="a">Bilangan a</label>
    <input type="number" id="a" placeholder="Masukkan bilangan a">

    <label for="m">Modulus m</label>
    <input type="number" id="m" placeholder="Masukkan modulus m">

    <button onclick="hitungMod()">Hitung Modulus</button>

    <div id="hasilMod" class="hasil"></div>

    <hr>

    <h2>Pengecek Kongruensi</h2>

    <label for="b">Bilangan b</label>
    <input type="number" id="b" placeholder="Masukkan bilangan b">

    <button onclick="cekKongruensi()">Periksa Kongruensi</button>

    <div id="hasilKongruensi" class="hasil"></div>

</div>

<script>

function hitungMod() {

    let a = parseInt(document.getElementById("a").value);
    let m = parseInt(document.getElementById("m").value);

    let hasilDiv = document.getElementById("hasilMod");

    if (isNaN(a) || isNaN(m)) {
        hasilDiv.innerHTML =
            "<p class='error'>Masukkan nilai a dan m terlebih dahulu.</p>";
        return;
    }

    if (m <= 0) {
        hasilDiv.innerHTML =
            "<p class='error'>Modulus harus merupakan bilangan bulat positif.</p>";
        return;
    }

    let hasil = ((a % m) + m) % m;
    let k = (a - hasil) / m;

    hasilDiv.innerHTML = `
        <h3>Hasil Perhitungan Modulus</h3>
        <p><strong>${a} mod ${m} = ${hasil}</strong></p>

        <h3>Proses</h3>
        <p>${a} = (${k} × ${m}) + ${hasil}</p>
        <p>Sisa pembagian = ${hasil}</p>
    `;
}

function cekKongruensi() {

    let a = parseInt(document.getElementById("a").value);
    let b = parseInt(document.getElementById("b").value);
    let m = parseInt(document.getElementById("m").value);

    let hasilDiv = document.getElementById("hasilKongruensi");

    if (isNaN(a) || isNaN(b) || isNaN(m)) {
        hasilDiv.innerHTML =
            "<p class='error'>Masukkan nilai a, b, dan m terlebih dahulu.</p>";
        return;
    }

    if (m <= 0) {
        hasilDiv.innerHTML =
            "<p class='error'>Modulus harus merupakan bilangan bulat positif.</p>";
        return;
    }

    let selisih = a - b;

    if (selisih % m === 0) {

        hasilDiv.innerHTML = `
            <h3>Hasil Pengecekan Kongruensi</h3>

            <p><strong>${a} ≡ ${b} (mod ${m})</strong></p>

            <p class="kongruen">
                Status : KONGRUEN
            </p>

            <h3>Proses Pengecekan</h3>

            <p>a - b = ${a} - ${b} = ${selisih}</p>

            <p>${selisih} mod ${m} = 0</p>

            <p>Karena ${m} membagi ${selisih}, maka:</p>

            <p><strong>${a} ≡ ${b} (mod ${m})</strong></p>
        `;

    } else {

        hasilDiv.innerHTML = `
            <h3>Hasil Pengecekan Kongruensi</h3>

            <p><strong>${a} ≢ ${b} (mod ${m})</strong></p>

            <p class="tidak-kongruen">
                Status : TIDAK KONGRUEN
            </p>

            <h3>Proses Pengecekan</h3>

            <p>a - b = ${a} - ${b} = ${selisih}</p>

            <p>${selisih} mod ${m} = ${selisih % m}</p>

            <p>Karena ${m} tidak membagi ${selisih}, maka:</p>

            <p><strong>${a} ≢ ${b} (mod ${m})</strong></p>
        `;

    }
}

</script>

</body>
</html>
