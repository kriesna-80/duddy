<script>
  const modForm = document.getElementById("modForm");
  const congruenceForm = document.getElementById("congruenceForm");
  const hasilMod = document.getElementById("hasilMod");
  const hasilKongruensi = document.getElementById("hasilKongruensi");

  function readInteger(id) {
    const value = document.getElementById(id).value.trim();

    if (!/^-?[0-9]+$/.test(value)) {
      return null;
    }

    return BigInt(value);
  }

  function showResult(element, message) {
    element.textContent = message;
    element.classList.add("has-value");
  }

  modForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const a = readInteger("a");
    const m = readInteger("m");

    if (a === null || m === null) {
      showResult(hasilMod, "Masukkan bilangan bulat a dan modulus m.");
      return;
    }

    if (m <= 0n) {
      showResult(hasilMod, "Modulus harus merupakan bilangan bulat positif.");
      return;
    }

    const remainder = ((a % m) + m) % m;
    const quotient = (a - remainder) / m;

    showResult(
      hasilMod,
      `Proses: ${a} = (${quotient} × ${m}) + ${remainder}\n` +
      `Hasil: ${a} mod ${m} = ${remainder}`
    );
  });

  congruenceForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const a = readInteger("a2");
    const b = readInteger("b");
    const m = readInteger("m2");

    if (a === null || b === null || m === null) {
      showResult(
        hasilKongruensi,
        "Masukkan bilangan bulat a, b, dan modulus m."
      );
      return;
    }

    if (m <= 0n) {
      showResult(
        hasilKongruensi,
        "Modulus harus merupakan bilangan bulat positif."
      );
      return;
    }

    const difference = a - b;
    const remainder = ((difference % m) + m) % m;
    const quotient = (difference - remainder) / m;
    const isCongruent = remainder === 0n;

    const divisionProcess = isCongruent
      ? `${difference} = ${quotient} × ${m}`
      : `${difference} = (${quotient} × ${m}) + ${remainder}`;

    const symbol = isCongruent ? "≡" : "≢";
    const status = isCongruent ? "KONGRUEN" : "TIDAK KONGRUEN";

    showResult(
      hasilKongruensi,
      `Proses: ${a} - ${b} = ${difference}\n` +
      `${divisionProcess}\n` +
      `Hasil: ${a} ${symbol} ${b} (mod ${m})\n` +
      `Status: ${status}`
    );
  });
</script>
